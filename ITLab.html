  <style>
    body { --lab-ink:#E6EAF0; --lab-mut:#b4c0cc; --lab-card:rgba(9,13,17,.66); --lab-line:rgba(0,255,255,.25); --lab-acc:#26C7BE; --lab-good:#57e0a0; --lab-now:#FFB74D; }

    .lab-wrap { max-width:1100px; margin:0 auto; padding:0 20px 120px; font-family:'Courier New',monospace; color:var(--lab-ink); }
    .lab-wrap * { box-sizing:border-box; }
    .lab-wrap p, .lab-wrap li, .lab-wrap h1, .lab-wrap h2, .lab-wrap h3 { color:var(--lab-ink); margin:0; }
    .lab-card { background:var(--lab-card); border:1px solid var(--lab-line); border-radius:16px; padding:22px 26px; margin:18px 0; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }

    .lab-wrap h2 { font-size:26px; font-weight:700; margin-bottom:14px; }
    .lab-wrap h3 { font-size:19px; font-weight:700; }

    .lab-mut { color:var(--lab-mut) !important; font-size:15px; font-weight:700; }
    .lab-route { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); }
    .lab-stop { position:relative; padding:34px 12px 0 0; }
    .lab-stop::before { content:""; position:absolute; top:10px; left:0; right:0; height:4px; background:var(--lab-line); }
    .lab-stop::after { content:""; position:absolute; top:1px; left:0; width:22px; height:22px; border-radius:50%; border:4px solid var(--lab-mut); background:var(--lab-card); }
    .lab-stop.done::before { background:var(--lab-good); }
    .lab-stop.done::after { background:var(--lab-good); border-color:var(--lab-good); }
    .lab-stop.now::after { border-color:var(--lab-now); }
    .lab-stop small { display:block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--lab-mut); }
    .lab-stop.done small { color:var(--lab-good); }
    .lab-stop.now small { color:var(--lab-now); }
    .lab-stop b { display:block; font-size:17px; }
    .lab-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:16px; }
    .lab-item { border:1px solid var(--lab-line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; font-size:16px; font-weight:700; }
    .lab-pill { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; border:1px solid var(--lab-line); color:var(--lab-mut); white-space:nowrap; }
    .lab-pill.good { color:var(--lab-good); border-color:var(--lab-good); }
    .lab-pill.now { color:var(--lab-now); border-color:var(--lab-now); }
    .lab-row { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .lab-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; font-size:17px; font-weight:700; }
    .lab-list li { display:flex; gap:10px; align-items:baseline; }
    .lab-tick { color:var(--lab-good); flex:none; width:20px; }
    .lab-todo { color:var(--lab-mut); flex:none; width:20px; }
    .lab-bar { height:8px; border-radius:99px; background:var(--lab-line); overflow:hidden; flex:1; min-width:80px; }
    .lab-bar i { display:block; height:100%; background:var(--lab-acc); }
    .lab-panel { display:none; padding:16px 4px 4px; }
    .lab-panel.open { display:block; }
    .lab-wrap .accordion-btn { margin-top:10px; font-family:inherit; font-weight:700; display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .lab-dots { letter-spacing:3px; color:var(--lab-acc); white-space:nowrap; }
    .lab-nums { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; }
    .lab-nums b { display:block; font-size:34px; line-height:1.1; }
    .lab-btn { display:inline-block; background:#26C7BE; color:#1A1A1A !important; padding:10px 18px; text-decoration:none; border-radius:5px; font-weight:bold; font-size:16px; }
    .lab-wrap a { color:var(--lab-acc); }
    @media (max-width:760px) {
      .lab-wrap h1 { font-size:32px; }
      .lab-route { grid-template-columns:1fr; }
      .lab-stop { padding:0 0 16px 36px; }
      .lab-stop::before { top:0; bottom:0; left:9px; right:auto; width:4px; height:auto; }
      .lab-stop::after { top:0; }
    }
  </style>

// Dark / Light mode toggle — remembers choice across pages
function toggleMode() {
  const isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('siteMode', isLight ? 'light' : 'dark');
  const btn = document.getElementById('modeBtn');
  btn.innerHTML = isLight
    ? '☀️ Light <div class="toggle-track"><div class="toggle-thumb"></div></div>'
    : '🌙 Dark <div class="toggle-track"><div class="toggle-thumb"></div></div>';
}

(function() {
  if (localStorage.getItem('siteMode') === 'light') {
    document.body.classList.add('light-mode');
    const btn = document.getElementById('modeBtn');
    if (btn) btn.innerHTML = '☀️ Light <div class="toggle-track"><div class="toggle-thumb"></div></div>';
  }
})();
</script>

<!-- visit logging -->
<script src="visit-log.js" defer></script>

</body>
</html>
