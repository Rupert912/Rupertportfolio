<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Notes</title>

<!--
  ============================================================
  PRIVATE VISIT LOG — Rupert Burger
  ============================================================
  This page holds no secrets. It cannot show a single row of data
  until you type your key, and that key is checked by Google's
  servers, not here. Anyone who finds this file sees a locked box.

  Rename this file to something random before you upload it.
  ============================================================
-->

<style>
  :root {
    --ink:        #0B0E11;
    --panel:      #12171C;
    --panel-2:    #171E25;
    --line:       #232C35;
    --text:       #E6EAF0;
    --muted:      #7C8A99;
    --teal:       #26C7BE;
    --amber:      #FFB020;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }

  a { color: var(--teal); }

  :focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- Lock screen ---------- */

  #lock {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .lockbox {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 30px 26px;
  }

  .lockbox h1 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .lockbox p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }

  .field {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 11px 13px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }

  .field::placeholder { color: #4E5A66; }
  .field:focus { border-color: var(--teal); outline: none; }

  .btn {
    background: var(--teal);
    color: #06231F;
    border: 0;
    border-radius: 7px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 650;
    font-family: inherit;
    cursor: pointer;
  }

  .btn:hover { filter: brightness(1.08); }

  .btn-quiet {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 13px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-quiet:hover { color: var(--text); border-color: #33404C; }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 18px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }

  .err {
    color: #FF7A7A;
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
  }

  /* ---------- Header ---------- */

  header.bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .bar h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: .01em;
    flex: 1 1 auto;
  }

  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 9px;
    vertical-align: middle;
  }

  .ranges { display: flex; gap: 6px; }

  .range {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
  }

  .range[aria-pressed="true"] {
    background: rgba(38,199,190,.12);
    border-color: var(--teal);
    color: var(--teal);
  }

  /* ---------- Counter strip ---------- */

  .counts {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border-bottom: 1px solid var(--line);
  }

  .count {
    flex: 1 1 120px;
    padding: 22px 20px 20px 0;
  }

  .count b {
    display: block;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -.02em;
    line-height: 1.1;
  }

  .count span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .09em;
  }

  /* ---------- Layout below ---------- */

  .cols {
    display: grid;
    grid-template-columns: minmax(0,1fr) 290px;
    gap: 26px;
    margin-top: 26px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; }
  }

  .section-title {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  #search {
    width: 100%;
    margin-bottom: 14px;
  }

  /* ---------- Session log (the main thing) ---------- */

  .session {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel);
    margin-bottom: 9px;
    overflow: hidden;
  }

  .session summary {
    list-style: none;
    cursor: pointer;
    padding: 13px 15px;
    display: grid;
    grid-template-columns: 66px minmax(0,1fr) auto;
    gap: 14px;
    align-items: baseline;
  }

  .session summary::-webkit-details-marker { display: none; }
  .session summary:hover { background: var(--panel-2); }

  .stamp { color: var(--muted); font-size: 12.5px; }

  .who { min-width: 0; }

  .who strong {
    font-weight: 600;
    font-size: 14.5px;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .who em {
    font-style: normal;
    color: var(--muted);
    font-size: 12.5px;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .tally { text-align: right; white-space: nowrap; }
  .tally b { font-weight: 600; font-size: 14px; }
  .tally span { display: block; color: var(--muted); font-size: 12px; }

  .flag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 7px;
    vertical-align: 1px;
    background: rgba(255,176,32,.13);
    color: var(--amber);
  }

  .trail {
    border-top: 1px solid var(--line);
    background: var(--ink);
    padding: 6px 15px 12px;
  }

  .step {
    display: grid;
    grid-template-columns: 20px minmax(0,1fr) auto;
    gap: 12px;
    padding: 7px 0;
    font-size: 13.5px;
    border-bottom: 1px solid rgba(35,44,53,.6);
  }

  .step:last-child { border-bottom: 0; }
  .step i { font-style: normal; color: #46525E; font-size: 12px; }
  .step u { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step s { text-decoration: none; color: var(--muted); font-size: 12.5px; }

  .meta {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
  }

  /* ---------- Side lists ---------- */

  .card {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel);
    padding: 16px 16px 10px;
    margin-bottom: 16px;
  }

  .rank { margin: 0; padding: 0; list-style: none; }

  .rank li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    font-size: 13.5px;
    border-bottom: 1px solid rgba(35,44,53,.55);
  }

  .rank li:last-child { border-bottom: 0; }
  .rank li span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank li b { font-weight: 600; }

  .empty {
    border: 1px dashed var(--line);
    border-radius: 9px;
    padding: 34px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .empty b { display: block; color: var(--text); margin-bottom: 6px; font-size: 15px; }

  .note { color: var(--muted); font-size: 12px; margin-top: 26px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<body>

<!-- ============ LOCKED ============ -->
<div id="lock">
  <div class="lockbox">
    <h1>Locked</h1>
    <p>Enter your key to continue.</p>
    <input id="key" class="field mono" type="password" placeholder="Key" autocomplete="off" spellcheck="false">
    <label class="remember">
      <input id="remember" type="checkbox"> Stay unlocked on this device
    </label>
    <button id="unlock" class="btn">Unlock</button>
    <div id="lockErr" class="err" role="status"></div>
  </div>
</div>


<!-- ============ UNLOCKED ============ -->
<div id="panel" class="wrap" hidden>

  <header class="bar">
    <h1><span class="dot"></span>Visit log</h1>
    <div class="ranges" id="ranges">
      <button class="range" data-days="1"  aria-pressed="true">Today</button>
      <button class="range" data-days="7"  aria-pressed="false">7 days</button>
      <button class="range" data-days="30" aria-pressed="false">30 days</button>
      <button class="range" data-days="0"  aria-pressed="false">All</button>
    </div>
    <button id="refresh" class="btn-quiet">Refresh</button>
    <button id="lockAgain" class="btn-quiet">Lock</button>
  </header>

  <div class="counts" id="counts"></div>

  <div class="cols">
    <div>
      <p class="section-title">Sessions — newest first</p>
      <input id="search" class="field" type="search" placeholder="Filter by city, company, page or device">
      <div id="log"></div>
    </div>

    <aside>
      <div class="card">
        <p class="section-title">Most read pages</p>
        <ul class="rank" id="topPages"></ul>
      </div>
      <div class="card">
        <p class="section-title">Where from</p>
        <ul class="rank" id="topPlaces"></ul>
      </div>
      <div class="card">
        <p class="section-title">Networks</p>
        <ul class="rank" id="topOrgs"></ul>
      </div>
    </aside>
  </div>

  <p class="note" id="note"></p>
</div>


<script>
(function () {
  "use strict";

  /* ---------- Setting — fill this in ---------- */
  var ENDPOINT = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

  var rows = [];
  var days = 1;
  var key  = "";

  var $ = function (id) { return document.getElementById(id); };


  /* ---------- Unlocking ---------- */

  function storedKey() {
    try { return localStorage.getItem("rbx_key") || sessionStorage.getItem("rbx_key") || ""; }
    catch (e) { return ""; }
  }

  function keepKey(k, forever) {
    try {
      if (forever) localStorage.setItem("rbx_key", k);
      else sessionStorage.setItem("rbx_key", k);
    } catch (e) {}
  }

  function forgetKey() {
    try { localStorage.removeItem("rbx_key"); sessionStorage.removeItem("rbx_key"); } catch (e) {}
  }

  function load(k) {
    return fetch(ENDPOINT + "?key=" + encodeURIComponent(k) + "&limit=3000")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error("refused");
        return d.rows || [];
      });
  }

  $("unlock").addEventListener("click", tryUnlock);
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });

  function tryUnlock() {
    var k = $("key").value.trim();
    if (!k) return;

    $("lockErr").textContent = "Checking\u2026";

    load(k).then(function (data) {
      key = k;
      keepKey(k, $("remember").checked);
      rows = data;
      openPanel();
    }).catch(function () {
      $("lockErr").textContent = "That key was not accepted.";
      $("key").value = "";
      $("key").focus();
    });
  }

  function openPanel() {
    $("lock").hidden = true;
    $("panel").hidden = false;
    document.title = "Visit log";
    draw();
  }

  $("lockAgain").addEventListener("click", function () {
    forgetKey();
    location.reload();
  });

  $("refresh").addEventListener("click", function () {
    $("note").textContent = "Refreshing\u2026";
    load(key).then(function (d) { rows = d; draw(); });
  });

  $("ranges").addEventListener("click", function (e) {
    var b = e.target.closest(".range");
    if (!b) return;
    days = Number(b.dataset.days);
    Array.prototype.forEach.call(this.querySelectorAll(".range"), function (x) {
      x.setAttribute("aria-pressed", String(x === b));
    });
    draw();
  });

  $("search").addEventListener("input", draw);


  /* ---------- Shaping the data ---------- */

  function inRange(r) {
    if (!days) return true;
    var t = new Date(r.when).getTime();
    if (isNaN(t)) return true;
    var start = new Date();
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - (days - 1));
    return t >= start.getTime();
  }

  function matches(r, q) {
    if (!q) return true;
    return [r.city, r.country, r.company, r.domain, r.page, r.title, r.device, r.browser, r.referrer]
      .join(" ").toLowerCase().indexOf(q) > -1;
  }

  function groupSessions(list) {
    var map = {}, order = [];

    list.forEach(function (r) {
      var id = r.sessionId || r.hitId;
      if (!map[id]) {
        map[id] = {
          id: id, hits: [], first: r.when,
          city: r.city, region: r.region, country: r.country,
          company: r.company, domain: r.domain, asn: r.asn, ip: r.ip,
          device: r.device, browser: r.browser, os: r.os,
          screen: r.screen, language: r.language,
          referrer: r.referrer, visitorType: r.visitorType,
          seconds: 0
        };
        order.push(id);
      }
      var s = map[id];
      s.hits.push(r);
      s.seconds += Number(r.seconds) || 0;
      if (r.when < s.first) s.first = r.when;
      if (!s.city && r.city) s.city = r.city;
      if (!s.company && r.company) s.company = r.company;
    });

    var out = order.map(function (id) { return map[id]; });
    out.forEach(function (s) { s.hits.sort(function (a, b) { return a.when < b.when ? -1 : 1; }); });
    out.sort(function (a, b) { return a.first < b.first ? 1 : -1; });
    return out;
  }

  function tally(list, pick) {
    var counts = {};
    list.forEach(function (r) {
      var k = (pick(r) || "").trim();
      if (!k) return;
      counts[k] = (counts[k] || 0) + 1;
    });
    return Object.keys(counts)
      .map(function (k) { return { name: k, n: counts[k] }; })
      .sort(function (a, b) { return b.n - a.n; })
      .slice(0, 8);
  }

  function spell(sec) {
    sec = Math.round(sec || 0);
    if (!sec) return "\u2014";
    if (sec < 60) return sec + "s";
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m < 60) return (m + "m " + (s ? s + "s" : "")).trim();
    return Math.floor(m / 60) + "h " + (m % 60) + "m";
  }

  function clock(iso) {
    var t = new Date(iso);
    if (isNaN(t)) return String(iso).slice(11, 16);
    return String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
  }

  function dayLabel(iso) {
    var t = new Date(iso);
    if (isNaN(t)) return "";
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var d = new Date(t); d.setHours(0, 0, 0, 0);
    var gap = Math.round((today - d) / 86400000);
    if (gap === 0) return "";
    if (gap === 1) return "Yesterday";
    return t.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  function safe(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function source(ref) {
    if (!ref || ref === "direct") return "typed the address or a bookmark";
    try { return "came from " + new URL(ref).hostname.replace(/^www\./, ""); }
    catch (e) { return "came from " + ref; }
  }


  /* ---------- Drawing ---------- */

  function draw() {
    var q = $("search").value.trim().toLowerCase();
    var list = rows.filter(inRange).filter(function (r) { return matches(r, q); });
    var sessions = groupSessions(list);

    var people = {};
    list.forEach(function (r) { if (r.visitorId) people[r.visitorId] = 1; });

    var totalSec = sessions.reduce(function (a, s) { return a + s.seconds; }, 0);
    var withTime = sessions.filter(function (s) { return s.seconds > 0; }).length;

    $("counts").innerHTML =
      block(sessions.length, "Visits") +
      block(list.length, "Pages opened") +
      block(Object.keys(people).length, "People") +
      block(spell(withTime ? totalSec / withTime : 0), "Typical stay");

    if (!sessions.length) {
      $("log").innerHTML =
        '<div class="empty"><b>Nothing logged in this window.</b>' +
        'Widen the range, clear the filter, or open your site from another device to test it.</div>';
    } else {
      $("log").innerHTML = sessions.map(card).join("");
    }

    fill("topPages",  tally(list, function (r) { return r.page; }));
    fill("topPlaces", tally(list, function (r) {
      return r.city ? r.city + ", " + r.country : r.country;
    }));
    fill("topOrgs",   tally(list, function (r) { return r.company; }));

    $("note").textContent = rows.length + " entries loaded. Times shown in your own clock.";
  }

  function block(value, label) {
    return '<div class="count"><b class="mono">' + safe(value) + '</b><span>' + safe(label) + '</span></div>';
  }

  function fill(id, items) {
    $(id).innerHTML = items.length
      ? items.map(function (i) {
          return '<li><span>' + safe(i.name) + '</span><b class="mono">' + i.n + '</b></li>';
        }).join("")
      : '<li><span>Nothing yet</span></li>';
  }

  function card(s) {
    var place = [s.city, s.country].filter(Boolean).join(", ") || "Location not picked up";
    var day = dayLabel(s.first);

    var trail = s.hits.map(function (h, i) {
      return '<div class="step">' +
               '<i class="mono">' + (i + 1) + '</i>' +
               '<u>' + safe(h.page) + '</u>' +
               '<s class="mono">' + spell(h.seconds) + '</s>' +
             '</div>';
    }).join("");

    var facts = [
      s.company ? "Network: " + safe(s.company) : "",
      s.domain  ? "Domain: " + safe(s.domain) : "",
      s.asn     ? safe(s.asn) : "",
      s.ip      ? "IP " + safe(s.ip) : "",
      safe(s.device + " \u00B7 " + s.os + " \u00B7 " + s.browser),
      s.screen ? safe(s.screen) : "",
      s.region ? safe(s.region) : "",
      safe(source(s.referrer))
    ].filter(Boolean).map(function (f) { return "<span>" + f + "</span>"; }).join("");

    return '<details class="session">' +
      '<summary>' +
        '<span class="stamp mono">' + clock(s.first) + (day ? '<br>' + safe(day) : '') + '</span>' +
        '<span class="who">' +
          '<strong>' + safe(place) +
            (s.visitorType === "returning" ? '<span class="flag">back again</span>' : '') +
          '</strong>' +
          '<em>' + safe(s.company || "Network not identified") + '</em>' +
        '</span>' +
        '<span class="tally">' +
          '<b class="mono">' + s.hits.length + (s.hits.length === 1 ? " page" : " pages") + '</b>' +
          '<span class="mono">' + spell(s.seconds) + '</span>' +
        '</span>' +
      '</summary>' +
      '<div class="trail">' + trail +
        '<div class="meta">' + facts + '</div>' +
      '</div>' +
    '</details>';
  }


  /* ---------- Start ---------- */

  var saved = storedKey();
  if (saved) {
    load(saved).then(function (d) {
      key = saved; rows = d; openPanel();
    }).catch(function () {
      forgetKey();
      $("key").focus();
    });
  } else {
    $("key").focus();
  }

})();
</script>

</body>
</html>
